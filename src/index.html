<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ignacio Gomez — Desarrollador Full Stack. MERN stack, arquitecturas de microservicios y AWS."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🇦🇷</text></svg>" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@600;700;900&display=swap"
    />

    <title>Portfolio | Ignacio Gomez</title>

    <!-- Resolves the theme before first paint. Must stay in sync with ThemeProvider. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("portfolio-theme");
          const theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
          const resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          document.documentElement.classList.add(resolved);
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", resolved === "dark" ? "#0a0a0b" : "#f8f6f2");
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
